<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shivesh Rane — CS Student / AI Researcher</title>
    <meta name="description" content="Shivesh Rane — CS student and AI researcher working on language models, sequence modelling and ML interpretability." />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Crect x='6' y='6' width='6' height='6' rx='1' fill='%23ff7a45'/%3E%3Crect x='6' y='13' width='6' height='6' rx='1' fill='%23ff7a45' opacity='.5'/%3E%3Crect x='13' y='13' width='6' height='6' rx='1' fill='%23ff7a45'/%3E%3Crect x='6' y='20' width='6' height='6' rx='1' fill='%23ff7a45' opacity='.25'/%3E%3Crect x='13' y='20' width='6' height='6' rx='1' fill='%23ff7a45' opacity='.4'/%3E%3Crect x='20' y='20' width='6' height='6' rx='1' fill='%23ff7a45'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"Geist Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            },
            colors: {
              bg: 'var(--bg)',
              surface: 'var(--surface)',
              line: 'var(--line)',
              ink: 'var(--ink)',
              muted: 'var(--muted)',
              faint: 'var(--faint)',
              accent: 'rgb(var(--accent-rgb) / <alpha-value>)',
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --bg: #0a0a0b;
        --surface: #111113;
        --line: #1e1e22;
        --ink: #ededee;
        --muted: #9a9aa3;
        --faint: #5c5c64;
        --accent-rgb: 255 122 69;
        color-scheme: dark;
      }

      html { scroll-behavior: smooth; scroll-padding-top: 80px; }

      body {
        background-color: var(--bg);
        color: var(--ink);
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
      }

      ::selection { background: rgb(var(--accent-rgb) / 0.3); color: #fff; }

      /* Faint plot grid behind the hero, fading out */
      .plot-grid {
        background-image:
          linear-gradient(to right, var(--line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--line) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 80% 70% at 70% 30%, #000 20%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 80% 70% at 70% 30%, #000 20%, transparent 75%);
      }

      /* Same grid in the accent colour, revealed only around the cursor */
      .plot-grid-hot {
        background-image:
          linear-gradient(to right, rgb(var(--accent-rgb) / 0.45) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(var(--accent-rgb) / 0.45) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(220px circle at var(--mx, -999px) var(--my, -999px), #000, transparent 70%);
        -webkit-mask-image: radial-gradient(220px circle at var(--mx, -999px) var(--my, -999px), #000, transparent 70%);
      }

      /* Cards: soft accent glow that follows the cursor */
      .glow-card { position: relative; isolation: isolate; }
      .glow-card::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        background: radial-gradient(360px circle at var(--mx, 50%) var(--my, 50%), rgb(var(--accent-rgb) / 0.09), transparent 45%);
        opacity: 0;
        transition: opacity 0.3s;
      }
      .glow-card:hover::before { opacity: 1; }

      /* Hide scrollbar but keep scrolling (contribution graph) */
      .scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }

      /* Native <details> marker off; we draw our own */
      summary { list-style: none; }
      summary::-webkit-details-marker { display: none; }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: #26262b; border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: #3a3a40; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
